const SEQ=[{n:"How a PC boots",s:B,t:"Power → ROM/BIOS → POST → CMOS → find system files → load kernel into RAM → desktop."},{n:"Web publishing",s:["Plan a Web site","Analyze and design a Web site","Create a Web site","Deploy a Web site","Maintain a Web site"],t:"Plan → Analyze/design → Create → Deploy → Maintain."},{n:"Internet history",s:["1969: ARPANET becomes functional","1984: ARPANET has more than 1,000 hosts","1986: NSF connects NSFnet to ARPANET; it becomes known as the Internet","1995: NSFNet ends and resumes status as a research network","1996: Internet2 begins"],t:"1969 ARPANET → 1984 1,000 hosts → 1986 NSFnet → 1995 NSFNet ends → 1996 Internet2."},{n:"Encrypt a file in Windows",s:["Locate the folder or file","Right-click it and select Properties","On the General tab, click Advanced","Move to Compress or Encrypt attributes","Check Encrypt content to secure data"],t:"Locate → Properties → General/Advanced → Encrypt attributes → check the box."},{n:"Developing a document",s:["Create the document","Edit the document","Format the document"],t:"Create → Edit → Format."}];
const $=s=>document.querySelector(s),app=$("#app");
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
let sv={xp:0,best:{},bs:0};try{Object.assign(sv,JSON.parse(localStorage.getItem("sq")||"{}"))}catch(e){}
const persist=()=>{try{localStorage.setItem("sq",JSON.stringify(sv))}catch(e){}};
let flt="all",T=0,kh=null;
document.onkeydown=e=>kh&&kh(e);
const pool=()=>flt=="all"?D:D.filter(d=>GM[d[2]]==flt);
const stars=p=>{const n=p>=.9?3:p>=.7?2:p>=.4?1:0;return"★".repeat(n)+"☆".repeat(3-n)};
function tween(el,to,d=800){const f=+el.dataset.v||0;el.dataset.v=to;if(RM||f==to){el.textContent=to;return}const t0=performance.now();(function s(t){const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(f+(to-f)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function view(h){clearTimeout(T);kh=null;app.innerHTML=h;scrollTo(0,0)}
function counters(){app.querySelectorAll("[data-n]").forEach(e=>tween(e,+e.dataset.n,1000))}
$("#logo").onclick=()=>home();$("#logo").onkeydown=e=>{if(e.key=="Enter")home()};

function home(){
const ch=[["all","All modules"],[5,"M5 Software"],[6,"M6 Databases"],[7,"M7 Networks"],[8,"M8 Security"]];
view(`<h1>Modules 5 to 8 exam prep.</h1>
<div class="stats"><button class="st" id="play"><b>Play</b><span>random game</span></button><button class="st" id="modt"><b>Module</b><span>${flt=="all"?"all modules":"M"+flt+" "+MODS[flt]}</span></button><div class="st"><b data-n="${sv.bs||0}">0</b><span>best streak</span></div></div>
<div class="chips">${ch.map(c=>`<button data-f="${c[0]}" class="${flt==c[0]?"on":""}">${c[1]}</button>`).join("")}</div>
<div class="modes">${GAMES.map((x,k)=>`<button class="mode" data-g="${k}" style="--mc:${x[3]}"><b>${x[0]}</b><span>${x[1]}</span></button>`).join("")}</div>`);
app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{flt=b.dataset.f=="all"?"all":+b.dataset.f;home()});
app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>GAMES[b.dataset.g][2]());
$("#play").onclick=()=>sh(GAMES)[0][2]();
$("#modt").onclick=()=>{const o=["all",5,6,7,8];flt=o[(o.indexOf(flt)+1)%5];home()};counters()}
function quiz(){const qs=sh(pool()).slice(0,10);let i=0,lives=3,st=0,ok=0,miss=[],earn=0;
function q(){if(i>=qs.length||lives<=0)return end();const c=qs[i],rev=i%2==1;
const o=sh([c,...sh(D.filter(d=>d!==c&&d[2]==c[2])).slice(0,3)]);
view(`<div class="bar"><span>Q <b>${i+1}</b>/${qs.length}</span><span class="lives">${"♥".repeat(lives)+"♡".repeat(3-lives)}</span><span>streak <b>${st}</b></span></div><div class="tm"><i id="tb"></i></div>
<div class="card q"><p class="mu">${rev?"Which definition matches this term?":"Which term matches this definition?"}</p><h2>${rev?c[0]:c[1]}</h2></div>
${o.map((x,k)=>`<button class="opt" data-k="${k}"><kbd>${k+1}</kbd>${rev?x[1]:x[0]}</button>`).join("")}<div id="fb"></div>`);
let done=false;const t0=Date.now(),tb=$("#tb");
requestAnimationFrame(()=>requestAnimationFrame(()=>{tb.style.transition="width 15s linear";tb.style.width="0"}));
const pick=k=>{if(done)return;done=true;clearTimeout(T);tb.style.transition="none";tb.style.width=getComputedStyle(tb).width;
const good=k>=0&&o[k]===c,left=Math.max(0,15-(Date.now()-t0)/1000),bs=app.querySelectorAll(".opt");
bs.forEach((x,j)=>{x.disabled=true;if(o[j]===c)x.classList.add("ok")});
if(good){st++;ok++;if(st>(sv.bs||0)){sv.bs=st;persist()}}else{if(k>=0)bs[k].classList.add("no","shake");lives--;st=0;miss.push(c)}
$("#fb").innerHTML=`<div class="card ${good?"gd":"bd"}"><b>${good?"Correct.":k<0?"Time's up.":"Not quite."}</b> ${c[0]}: ${c[1]}</div><button class="go" id="nx">Next <kbd>Enter</kbd></button>`;
$("#nx").onclick=()=>{i++;q()};$("#nx").focus()};
app.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>pick(k));
T=setTimeout(()=>pick(-1),15000);
kh=e=>{if(/^[1-4]$/.test(e.key))pick(+e.key-1);else if(e.key=="Enter"&&done&&document.activeElement.id!="nx")$("#nx").click()}}
function end(){const win=lives>0,rank=ok>=9?"Root access":ok>=7?"Sysadmin":ok>=5?"Power user":"Newbie";
view(`<div class="card ctr"><p class="mu">${win?"Round complete":"Out of lives"} · rank: ${rank}</p><div class="big"><span data-n="${ok}">0</span>/${qs.length}</div></div>
${miss.length?`<div class="card"><b>Review these</b><ul>${miss.map(m=>`<li><b>${m[0]}</b>: ${m[1]}</li>`).join("")}</ul></div>`:""}
<button class="go" id="a1">Play again</button><button id="a2">Back to menu</button>`);
$("#a1").onclick=quiz;$("#a2").onclick=home;counters()}
q()}

function cards(){let dk=sh(pool()),n=dk.length,done=0;
function show(){if(!dk.length){view(`<div class="card ctr"><div class="big">100%</div><h2>Deck cleared</h2><p class="mu">${n} cards mastered</p></div><button class="go" id="a1">Go again</button><button id="a2">Back to menu</button>`);$("#a1").onclick=cards;$("#a2").onclick=home;return}
const c=dk[0];let fl=false;
view(`<div class="bar"><span><b>${done}</b>/${n} mastered</span><span>${dk.length} left</span></div><div class="tm"><i style="width:${done/n*100}%"></i></div>
<div class="fc" id="cd" tabindex="0"><div class="in"><div class="face"><p class="mu">tap or press space to flip</p><h2>${c[0]}</h2></div><div class="face back"><p class="mu">${c[0]}</p><h3>${c[1]}</h3></div></div></div>
<div class="row" id="rw" style="visibility:hidden"><button id="ag"><kbd>1</kbd>Again</button><button class="go" id="gt"><kbd>2</kbd>Got it</button></div>`);
const flip=()=>{fl=!fl;$("#cd").classList.toggle("fp",fl);$("#rw").style.visibility=fl?"visible":"hidden"},
gt=()=>{dk.shift();done++;show()},ag=()=>{dk.push(dk.shift());show()};
$("#cd").onclick=flip;$("#gt").onclick=gt;$("#ag").onclick=ag;
kh=e=>{const b=document.activeElement.tagName=="BUTTON";if(e.key==" "||(e.key=="Enter"&&!b)){e.preventDefault();if(!b)flip()}else if(fl&&(e.key=="1"||e.key=="ArrowLeft"))ag();else if(fl&&(e.key=="2"||e.key=="ArrowRight"))gt()}}
show()}

function sortHome(){view(`<h2>Sort It</h2><p class="mu">Choose a module level. Earn stars for accuracy.</p>`+[5,6,7,8].map(m=>{const rs=S.filter(r=>r.m==m),n=rs.reduce((a,r)=>a+r.i.length,0);
return`<button class="mod" data-m="${m}"><span class="mn">M${m}</span><span><b>${MODS[m]}</b><span class="mu">${rs.length} rounds · ${n} items</span></span><span class="stars">${stars(sv.best["m"+m]||0)}</span></button>`}).join("")+`<button id="bk">Back</button>`);
app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>sortMod(+b.dataset.m));$("#bk").onclick=home}
function sortMod(m){const rs=S.filter(r=>r.m==m);
view(`<p class="mu">Module ${m}</p><h2>${MODS[m]}</h2><button class="go" id="all">Full level: mixed 12 items</button><p class="mu">Or practice one round</p>`+rs.map((r,k)=>`<button data-k="${k}"><span><b>${r.n}</b><br><span class="mu">${r.i.length} items</span></span><span class="stars">${stars(sv.best[m+r.n]||0)}</span></button>`).join("")+`<button id="bk">Back to levels</button>`);
const mk=(key,list)=>()=>sortG(key,sh(list).map(x=>x),sortMod,m);
$("#all").onclick=()=>sortG("m"+m,sh(rs.flatMap(r=>r.i.map(x=>({t:x[0],a:x[1],r})))).slice(0,12),()=>sortMod(m),m);
app.querySelectorAll("[data-k]").forEach(b=>{const r=rs[b.dataset.k];b.onclick=()=>sortG(m+r.n,sh(r.i.map(x=>({t:x[0],a:x[1],r}))),()=>sortMod(m),m)});
$("#bk").onclick=sortHome}
function sortG(key,it,back,m){let i=0,sc=0,st=0,miss=[],earn=0;
function r(){if(i>=it.length)return fin();const x=it[i];
view(`<div class="bar"><span><b>${i+1}</b>/${it.length}</span><span class="tag">${x.r.n}</span><span>combo <b>${st}</b></span></div><div class="tm"><i style="width:${i/it.length*100}%"></i></div>
<div class="card q"><p class="mu">Where does this belong?</p><h2>${x.t}</h2></div>${x.r.c.map((c,k)=>`<button class="opt"><kbd>${k+1}</kbd>${c}</button>`).join("")}<div id="fb"></div>`);
let done=false;
const pick=k=>{if(done)return;done=true;const bs=app.querySelectorAll(".opt"),good=k==x.a;bs.forEach((y,j)=>{y.disabled=true;if(j==x.a)y.classList.add("ok")});
if(good){sc++;st++;}else{bs[k].classList.add("no","shake");st=0;miss.push(x)}
$("#fb").innerHTML=(good?"":`<div class="card bd">Answer: <b>${x.r.c[x.a]}</b></div>`)+`<button class="go" id="nx">${i+1<it.length?"Next":"Finish"}</button>`;$("#nx").onclick=()=>{i++;r()};$("#nx").focus()};
app.querySelectorAll(".opt").forEach((b,k)=>b.onclick=()=>pick(k));
kh=e=>{if(/^[1-9]$/.test(e.key)&&+e.key<=x.r.c.length)pick(+e.key-1)}}
function fin(){const p=sc/it.length;sv.best[key]=Math.max(sv.best[key]||0,p);persist();
view(`<div class="card ctr"><p class="mu">Level complete</p><div class="big"><span data-n="${sc}">0</span>/${it.length}</div><p class="stars" style="font-size:26px">${stars(p)}</p></div>
${miss.length?`<div class="card"><b>Review these</b><ul>${miss.map(x=>`<li><b>${x.t}</b>: ${x.r.c[x.a]}</li>`).join("")}</ul></div>`:""}
<button class="go" id="a1">Play again</button><button id="a2">Back to level</button>`);
$("#a1").onclick=()=>sortG(key,sh(it),back,m);$("#a2").onclick=back;counters()}
r()}

function bootMenu(){view(`<h2>Order It</h2><p class="mu">Tap the steps in the right order.</p>`+SEQ.map((d,k)=>`<button data-k="${k}"><b>${d.n}</b><span class="stars">${stars(sv.best["o"+d.n]||0)}</span></button>`).join("")+`<button id="bk">Back</button>`);
app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>boot(SEQ[b.dataset.k]));$("#bk").onclick=home}
function boot(d){const B=d.s;let order=sh(B.map((t,i)=>i)),nxt=0,bad=0;
function r(){view(`<h2>${d.n}</h2><div class="bar"><span>placed <b>${nxt}</b>/${B.length}</span><span>mistakes <b>${bad}</b></span></div><div class="tm"><i style="width:${nxt/B.length*100}%"></i></div>`+
order.map(i=>`<button class="st ${i<nxt?"ok":""}" data-i="${i}" ${i<nxt?"disabled":""}>${i<nxt?`<kbd>${i+1}</kbd>`:""}${B[i]}</button>`).join("")+
(nxt==B.length?`<div class="card gd"><b>Memory trick</b><p>${d.t}</p></div><button class="go" id="a1">Shuffle again</button><button id="a2">Back to menu</button>`:""));
app.querySelectorAll(".st:not([disabled])").forEach(b=>b.onclick=()=>{if(+b.dataset.i==nxt){nxt++;if(nxt==B.length){const p=Math.max(0,1-bad/B.length);sv.best["o"+d.n]=Math.max(sv.best["o"+d.n]||0,p);persist()}r()}else{bad++;b.classList.add("no","shake");setTimeout(r,450)}});
if(nxt==B.length){$("#a1").onclick=()=>boot(d);$("#a2").onclick=bootMenu}}
r()}


const GAMES=[["Quiz Blitz","10 questions, 3 lives, 15 seconds each.",()=>quiz(),"var(--c)"],["Flashcards","Flip, then mark Got it or Again. Missed cards come back.",()=>cards(),"var(--v)"],["Sort It","Choose a module level, then sort items into categories.",()=>sortHome(),"var(--ok)"],["Order It","Put sequences in order: PC boot, Web publishing, Internet history.",()=>bootMenu(),"#ffc247"],["Match Rush","Pair 5 terms with their definitions, 3 rounds. Fewer mistakes, more stars.",()=>match(),"#ff8a3d"],["Speed True/False","60 seconds. Does this definition belong to this term?",()=>tf(),"var(--no)"],["Decrypt","Guess the hidden term letter by letter before you run out of lives.",()=>decrypt(),"#58a6ff"]];

function match(){let r=0,bad=0;const t0=Date.now(),R3=3;
function rd(){if(r>=R3)return mend();const c=sh(pool()).slice(0,5),L=sh(c),R=sh(c);let left=5,a=null;
view(`<div class="bar"><span>round <b>${r+1}</b>/${R3}</span><span>mistakes <b id="bd">${bad}</b></span></div><div class="tm"><i style="width:${r/R3*100}%"></i></div><p class="mu">Tap a term, then its definition.</p>
<div class="mg"><div>${L.map((x,k)=>`<button class="mt" data-s="L" data-k="${k}">${x[0]}</button>`).join("")}</div><div>${R.map((x,k)=>`<button class="mt" data-s="R" data-k="${k}">${x[1]}</button>`).join("")}</div></div>`);
app.querySelectorAll(".mt").forEach(b=>b.onclick=()=>{
if(a&&a.dataset.s==b.dataset.s){a.classList.remove("sel");a=b;b.classList.add("sel");return}
if(!a){a=b;b.classList.add("sel");return}
const p=a;a=null;p.classList.remove("sel");const l=p.dataset.s=="L"?p:b,rr=p.dataset.s=="L"?b:p;
if(L[+l.dataset.k]===R[+rr.dataset.k]){[l,rr].forEach(x=>{x.classList.add("ok");x.disabled=true});if(--left==0){r++;T=setTimeout(rd,500)}}
else{bad++;$("#bd").textContent=bad;[p,b].forEach(x=>x.classList.add("no","shake"));setTimeout(()=>[p,b].forEach(x=>x.classList.remove("no","shake")),400)}})}
function mend(){const s=Math.round((Date.now()-t0)/1000),p=Math.max(0,1-bad/10);sv.best.match=Math.max(sv.best.match||0,p);persist();
view(`<div class="card ctr"><p class="mu">All rounds cleared</p><div class="big">${s}s</div><p class="stars" style="font-size:26px">${stars(p)}</p><p class="mu">${bad} mistake${bad==1?"":"s"}</p></div><button class="go" id="a1">Play again</button><button id="a2">Back to menu</button>`);$("#a1").onclick=match;$("#a2").onclick=home}
rd()}

function tf(){const pl=sh(pool());let n=0,ok=0,no=0,left=60,cur;
view(`<div class="bar"><span>time <b id="tt">60</b></span><span>correct <b id="tc">0</b></span><span>wrong <b id="tw">0</b></span></div><div class="tm"><i id="tb" style="width:100%"></i></div><div id="qa"></div><div id="fb" class="mu"></div>`);
const nx=()=>{const c=pl[n++%pl.length],t=Math.random()<.5,o=t?c:sh(D.filter(d=>d!==c&&d[2]==c[2]))[0];cur={c,t};
$("#qa").innerHTML=`<div class="card q"><h2>${c[0]}</h2><p>${o[1]}</p></div><div class="row"><button id="bt"><kbd>T</kbd>True</button><button id="bf"><kbd>F</kbd>False</button></div>`;$("#bt").onclick=()=>an(true);$("#bf").onclick=()=>an(false)};
const an=v=>{const g=v===cur.t;if(g)ok++;else no++;$("#tc").textContent=ok;$("#tw").textContent=no;$("#fb").innerHTML=g?"Correct":`Wrong: <b>${cur.c[0]}</b> is ${cur.c[1]}`;nx()};
nx();T=setInterval(()=>{left--;$("#tt").textContent=left;$("#tb").style.width=left/60*100+"%";if(left<=0){clearInterval(T);fin()}},1000);
kh=e=>{const k=e.key.toLowerCase();if(k=="t"||e.key=="ArrowLeft")an(true);else if(k=="f"||e.key=="ArrowRight")an(false)};
function fin(){kh=null;const tot=ok+no;sv.best.tf=Math.max(sv.best.tf||0,ok);persist();
view(`<div class="card ctr"><p class="mu">Time's up</p><div class="big"><span data-n="${ok}">0</span></div><p class="mu">correct · ${tot?Math.round(ok/tot*100):0}% accuracy · best ${sv.best.tf}</p></div><button class="go" id="a1">Play again</button><button id="a2">Back to menu</button>`);$("#a1").onclick=tf;$("#a2").onclick=home;counters()}}

function decrypt(){const ws=sh(pool().filter(d=>d[0].replace(/[^a-z]/gi,"").length>=4&&d[0].length<=26)).slice(0,5);let i=0,sc=0;
function w(){if(i>=ws.length)return dend();const c=ws[i],W=c[0].toUpperCase(),g=new Set(),L=[...new Set(W.replace(/[^A-Z]/g,""))];let lives=6,done=false;
const show=()=>[...W].map(ch=>/[A-Z]/.test(ch)?(g.has(ch)||done?ch:"_"):ch==" "?"\u00a0\u00a0":ch).join(" ");
view(`<div class="bar"><span>word <b>${i+1}</b>/${ws.length}</span><span class="lives" id="hl">${"♥".repeat(6)}</span><span>solved <b>${sc}</b></span></div><div class="card q"><p class="mu">Decrypt the term for this definition</p><h3>${c[1]}</h3></div><div class="word" id="wd">${show()}</div><div class="kb">${[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div><div id="fb"></div>`);
const guess=k=>{if(done||g.has(k))return;g.add(k);const b=app.querySelector(`[data-k="${k}"]`);b.disabled=true;
if(W.includes(k))b.classList.add("ok");else{b.classList.add("no");lives--}
$("#hl").textContent="♥".repeat(lives)+"♡".repeat(6-lives);
const win=L.every(x=>g.has(x));
if(win||lives<=0){done=true;if(win)sc++;$("#fb").innerHTML=`<div class="card ${win?"gd":"bd"}"><b>${win?"Decrypted.":"Access denied."}</b> ${c[0]}</div><button class="go" id="nx">${i+1<ws.length?"Next":"Finish"}</button>`;$("#nx").onclick=()=>{i++;w()};$("#nx").focus()}
$("#wd").textContent=show()};
app.querySelectorAll(".kb button").forEach(b=>b.onclick=()=>guess(b.dataset.k));
kh=e=>{const k=e.key.toUpperCase();if(/^[A-Z]$/.test(k)&&!e.ctrlKey&&!e.metaKey&&!e.altKey)guess(k)}}
function dend(){const p=sc/ws.length;sv.best.dec=Math.max(sv.best.dec||0,p);persist();
view(`<div class="card ctr"><p class="mu">Run complete</p><div class="big"><span data-n="${sc}">0</span>/${ws.length}</div><p class="stars" style="font-size:26px">${stars(p)}</p></div><button class="go" id="a1">Play again</button><button id="a2">Back to menu</button>`);$("#a1").onclick=decrypt;$("#a2").onclick=home;counters()}
w()}

(function(){if(RM)return;const c=$("#rain"),x=c.getContext("2d");let w,h,y=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;y=Array.from({length:Math.ceil(w/22)},()=>Math.random()*h/22)};rs();addEventListener("resize",rs);
setInterval(()=>{if(document.hidden)return;x.fillStyle="rgba(6,10,19,.14)";x.fillRect(0,0,w,h);x.fillStyle="#3ee6ff";x.font="14px monospace";y.forEach((v,i)=>{x.fillText(Math.random()<.5?0:1,i*22,v*22);y[i]=v*22>h&&Math.random()>.975?0:v+1})},70)})();
home();
</script></body></html>
